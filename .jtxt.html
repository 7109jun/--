/* ============================================================
   YUNOCODE
   형식: J-XXXXXXXX
   X는 A-Z 26진수.
   각 문자 영역은 독립적인 10억 슬롯을 예약한다.
   ============================================================ */

const REGION_SIZE = 1000000000n;
const BASE = 26n;

function encode26(n){
  let out="";
  for(let i=0;i<8;i++){
    out=String.fromCharCode(65+Number(n%BASE))+out;
    n/=BASE;
  }
  return out;
}
function makeYunocode(region,index){
  return "J-"+encode26(BigInt(region)*REGION_SIZE+BigInt(index));
}

/* ------------------------------------------------------------
   영역
   ------------------------------------------------------------ */
const GROUPS=[
  ["제어/공백","CONTROL"],

  ["인도계 문자","INDIC"],
  ["태국어","THAI"],
  ["동남아 문자","SOUTHEAST_ASIA"],
  ["조지아/아르메니아","CAUCASIAN"],
  ["라틴 확장","LATIN_EXTENDED"],
  ["기호","SYMBOL"],
  ["수학","MATH"],
  ["화살표","ARROW"],
  ["통화","CURRENCY"],
  ["문장부호","PUNCTUATION"],
  ["괘선/박스","BOX"],
  ["도형","SHAPE"],
  ["음악","MUSIC"],
  ["체스/카드/게임","GAME"],

  ["확장","EXTENDED"]
];

const groups=new Map();
const charToY=new Map();
const yToChar=new Map();

GROUPS.forEach(([label,key],region)=>{
  groups.set(key,{label,key,region,chars:[],set:new Set()});
});

function addChars(key,text){
  const g=groups.get(key);
  if(!g)return;
  for(const ch of [...text]){
    if(!g.set.has(ch)){
      g.set.add(ch);
      g.chars.push(ch);
    }
  }
}
function addRange(key,start,end){
  const g=groups.get(key);
  if(!g)return;
  for(let cp=start;cp<=end;cp++){
    if(cp>=0xD800&&cp<=0xDFFF)continue;
    try{addChars(key,String.fromCodePoint(cp))}catch(_){}
  }
}

  });

/* 등록되지 않은 문자도 EXTENDED 영역에 자동 등록.
   따라서 "작동 안 하는 문자"를 JTXT가 unknown으로 버리지 않는다. */
function ensureYunocode(ch){
  const old=charToY.get(ch);
  if(old)return old;
  const g=groups.get("EXTENDED");
  const id=makeYunocode(g.region,g.chars.length);
  g.chars.push(ch);
  g.set.add(ch);
  charToY.set(ch,id);
  yToChar.set(id,ch);
  return id;
}

const editor=document.getElementById("editor");
const glyph=document.getElementById("glyph");
const yuno=document.getElementById("yunocode");
const category=document.getElementById("category");
const stats=document.getElementById("stats");
const status=document.getElementById("status");
const palette=document.getElementById("palette");
const paletteInfo=document.getElementById("paletteInfo");
const groupSelect=document.getElementById("group");
const search=document.getElementById("search");
const fileInput=document.getElementById("fileInput");

for(const [label,key] of GROUPS){
  const option=document.createElement("option");
  option.value=key;
  option.textContent=label;
  groupSelect.appendChild(option);
}

function findGroup(ch){
  for(const [,g] of groups){
    if(g.set.has(ch))return g;
  }
  return null;
}

function selectedChar(){
  const pos=editor.selectionStart;
  if(pos<=0)return "";
  const arr=[...editor.value.slice(0,pos)];
  return arr[arr.length-1]||"";
}

function updateSelection(){
  const ch=selectedChar();
  if(!ch){
    glyph.textContent="—";
    yuno.textContent="J-????????";
    category.textContent="문자 없음";
  }else{
    glyph.textContent=ch==="\n"?"↵":ch==="\t"?"⇥":ch;
    yuno.textContent=ensureYunocode(ch);
    const g=findGroup(ch);
    category.textContent=g?g.label:"확장";
  }
  updateStats();
}

function updateStats(){
  const chars=[...editor.value];
  for(const ch of chars)ensureYunocode(ch);
  const known=chars.filter(ch=>charToY.has(ch)).length;
  const lines=editor.value.length?editor.value.split("\n").length:1;
  stats.textContent=
    "문자: "+chars.length.toLocaleString()+"\\n"+
    "UTF-16 단위: "+editor.value.length.toLocaleString()+"\\n"+
    "줄: "+lines.toLocaleString()+"\\n"+
    "Yunocode 등록: "+known.toLocaleString()+"\\n"+
    "영역: "+groups.size+"개\\n"+
    "한글 완성형: "+groups.get("KOREAN").chars.length.toLocaleString()+"자\\n"+
    "CJK: "+groups.get("CJK").chars.length.toLocaleString()+"자\\n"+
    "이모지 영역: "+groups.get("EMOJI").chars.length.toLocaleString()+"자\n"+"전체 등록 문자: "+[...groups.values()].reduce((n,g)=>n+g.chars.length,0).toLocaleString()+"자\\n"+"저장: Yunocode 번호 → 38-bit binary";
}

function renderPalette(){
  palette.innerHTML="";
  const g=groups.get(groupSelect.value);
  if(!g)return;
  const q=search.value.trim();
  let list;
  if(q){
    list=g.chars.filter(ch=>ch.includes(q));
  }else{
    list=g.chars.slice(0,1200);
  }
  for(const ch of list){
    const b=document.createElement("button");
    b.textContent=ch==="\n"?"↵":ch==="\t"?"⇥":ch===" "?"␠":ch;
    b.title=ensureYunocode(ch);
    b.onclick=()=>{
      const a=editor.selectionStart;
      const z=editor.selectionEnd;
      editor.setRangeText(ch,a,z,"end");
      editor.focus();
      updateSelection();
    };
    palette.appendChild(b);
  }
  paletteInfo.textContent=
    g.label+" · 전체 "+g.chars.length.toLocaleString()+"자 · 현재 표시 "+list.length.toLocaleString()+"자"+
    (q?" · 검색 결과":" · 처음 1,200자 표시");
}

groupSelect.onchange=renderPalette;
search.oninput=renderPalette;

editor.addEventListener("input",updateSelection);
editor.addEventListener("click",updateSelection);
editor.addEventListener("keyup",updateSelection);
editor.addEventListener("select",updateSelection);

editor.addEventListener("keydown",e=>{
  if(e.key==="Tab"){
    e.preventDefault();
    const a=editor.selectionStart,z=editor.selectionEnd;
    editor.setRangeText("\t",a,z,"end");
    updateSelection();
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){
    e.preventDefault();
    saveJTXT();
  }
});

document.getElementById("newBtn").onclick=()=>{
  if(editor.value&&!confirm("현재 문서를 지울까요?"))return;
  editor.value="";
  updateSelection();
  status.textContent="새 문서";
};

document.getElementById("openBtn").onclick=()=>fileInput.click();

fileInput.onchange=async()=>{
  const file=fileInput.files[0];
  if(!file)return;
  try{
    if(file.name.toLowerCase().endsWith(".jtxt")){
      editor.value=readJTXBBinary(await file.arrayBuffer());
      status.textContent="JTXT 바이너리 열기 완료";
    }else{
      editor.value=await file.text();
      status.textContent="TXT 열기 완료";
    }
  }catch(err){
    alert("파일을 읽지 못했습니다.\\n"+err.message);
  }
  fileInput.value="";
  updateSelection();
};

function yunocodeNumber(id){
  let n=0n;
  for(let i=2;i<id.length;i++){
    n=n*26n+BigInt(id.charCodeAt(i)-65);
  }
  return n;
}

function writeU64(view,offset,value){
  view.setBigUint64(offset,value,true);
}

/* Yunocode 번호는 26진수이고, 번호 자체를 38비트 이진수로 변환한다.
   26^8 < 2^38 이므로 모든 J-XXXXXXXX를 38비트로 표현 가능. */
const YUNOCODE_BITS=38n;
const YUNOCODE_MAX=(1n<<YUNOCODE_BITS)-1n;

function buildJTXBBinary(){
  const chars=[...editor.value];
  const bitCount=BigInt(chars.length)*YUNOCODE_BITS;
  const payloadSize=Math.ceil(Number(bitCount)/8);
  const payload=new Uint8Array(payloadSize);

  let bitPos=0;
  for(const ch of chars){
    const number=yunocodeNumber(ensureYunocode(ch));

    /* 번호 -> 38자리 이진수 -> 비트 패킹 */
    for(let b=37;b>=0;b--){
      const bit=(number>>BigInt(b))&1n;
      if(bit){
        const byteIndex=Math.floor(bitPos/8);
        const bitIndex=7-(bitPos%8);
        payload[byteIndex]|=(1<<bitIndex);
      }
      bitPos++;
    }
  }

  const header=new ArrayBuffer(32);
  const hv=new DataView(header);
  const hb=new Uint8Array(header);

  hb[0]=0x4A; hb[1]=0x54; hb[2]=0x58; hb[3]=0x42;
  hb[4]=2; hb[5]=0;
  hv.setUint16(6,0x0002,true); // 38-bit packed Yunocode
  hv.setBigUint64(8,BigInt(chars.length),true);
  hv.setBigUint64(16,bitCount,true);
  hv.setBigUint64(24,0n,true);

  const output=new Uint8Array(32+payload.length);
  output.set(hb,0);
  output.set(payload,32);
  return output;
}

function readJTXBBinary(buffer){
  const bytes=new Uint8Array(buffer);
  if(bytes.length<32)throw new Error("JTXT 파일이 너무 작습니다.");
  if(bytes[0]!==0x4A||bytes[1]!==0x54||bytes[2]!==0x58||bytes[3]!==0x42)
    throw new Error("JTXB 바이너리 파일이 아닙니다.");

  const view=new DataView(buffer);
  if(view.getUint8(4)!==2)throw new Error("지원하지 않는 JTXT Binary 버전입니다.");

  const count=view.getBigUint64(8,true);
  const bitCount=view.getBigUint64(16,true);
  const expectedBits=count*YUNOCODE_BITS;
  if(bitCount!==expectedBits)throw new Error("Yunocode 비트 수가 올바르지 않습니다.");

  const expectedBytes=(Number(bitCount)+7)>>3;
  if(bytes.length-32!==expectedBytes)
    throw new Error("JTXT payload 크기가 올바르지 않습니다.");

  if(count>BigInt(Number.MAX_SAFE_INTEGER))
    throw new Error("문서가 너무 큽니다.");

  const out=[];
  let bitPos=0;

  for(let i=0;i<Number(count);i++){
    let number=0n;
    for(let b=0;b<38;b++){
      const byteIndex=Math.floor(bitPos/8);
      const bitIndex=7-(bitPos%8);
      const bit=(bytes[32+byteIndex]>>bitIndex)&1;
      number=(number<<1n)|BigInt(bit);
      bitPos++;
    }

    if(number>YUNOCODE_MAX)throw new Error("잘못된 Yunocode 번호입니다.");

    let n=number;
    const letters=new Array(8);
    for(let k=7;k>=0;k--){
      letters[k]=String.fromCharCode(65+Number(n%26n));
      n/=26n;
    }
    const id="J-"+letters.join("");
    out.push(yToChar.get(id)||" ");
  }
  return out.join("");
}

function downloadBinary(name,data){
  const blob=new Blob([data],{type:"application/octet-stream"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

function downloadFile(name,data,mime="text/plain;charset=utf-8"){
  const blob=new Blob([data],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

function saveJTXT(){
  downloadBinary("document.jtxt",buildJTXBBinary());
  status.textContent="JTXT 바이너리 저장 완료";
}

document.getElementById("saveBtn").onclick=saveJTXT;
document.getElementById("downloadBtn").onclick=saveJTXT;

document.getElementById("downloadMapBtn").onclick=()=>{
  const lines=["YUNOCODE CHARACTER MAP","format=J-XXXXXXXX","version=1",""];
  for(const [label,key] of GROUPS){
    const g=groups.get(key);
    lines.push("["+label+"]");
    for(let i=0;i<g.chars.length;i++){
      const ch=g.chars[i];
      const shown=ch==="\n"?"\\n":ch==="\t"?"\\t":ch===" "?"<SPACE>":ch;
      lines.push(makeYunocode(g.region,i)+" = "+shown);
    }
    lines.push("");
  }
  downloadFile("yunocode-map.txt",lines.join("\n"));
  status.textContent="Yunocode 목록 다운로드 완료";
};

document.getElementById("txtBtn").onclick=()=>{
  downloadFile("document.txt",editor.value);
  status.textContent="TXT 다운로드 완료";
};

document.getElementById("font").onchange=e=>{
  if(e.target.value==="mono")
    editor.style.fontFamily='"Cascadia Mono","Consolas","Noto Sans",monospace';
  else if(e.target.value==="serif")
    editor.style.fontFamily='Georgia,"Noto Serif",serif';
  else
    editor.style.fontFamily='system-ui,"Malgun Gothic","Noto Sans",sans-serif';
};

/* 기본 화면 */
groupSelect.value="KOREAN";
renderPalette();
updateSelection();
status.textContent="Yunocode 준비 완료 · JTXT Binary 2.0 · 38-bit";
</script>
